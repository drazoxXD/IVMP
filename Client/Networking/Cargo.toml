[package]
name = "Networking"
description = "In-game networking: IVMP server connection and tunnel, peer identity, the engine's socket / relay, hosting and joining sessions, second client (-cl2)."
version = "0.1.0"
edition = "2024"

[lib]
name = "ivmp_networking"

[dependencies]
Core = { path = "../Core" }
NativeInvoker = { path = "../NativeInvoker" }
Shared = { path = "../Shared" }
NetProtocol = { path = "../../Server/NetProtocol" }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
