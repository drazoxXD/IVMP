<!doctype html>
<meta charset="utf-8">
<title>IVMP web layer</title>
<style>
  html, body { margin: 0; background: transparent; font: 18px Segoe UI, sans-serif; color: #e8eef5; overflow: hidden; }
  .version { position: absolute; right: 16px; bottom: 12px; font-size: 15px; font-weight: 600;
             color: rgba(255, 255, 255, .8); text-shadow: 0 1px 3px rgba(0, 0, 0, .9); pointer-events: none; }
</style>
<div class="version" id="version">IVMP</div>
<script src="ivmp.js"></script>
<script>
  // Bottom right: "IVMP", or "IVMP - N Mods loaded" when the client loaded mods.
  ivmp.on('game.info', ({ mods }) => {
    const label = mods > 0 ? `IVMP - ${mods} ${mods === 1 ? 'Mod' : 'Mods'} loaded` : 'IVMP';
    document.getElementById('version').textContent = label;
  });
  ivmp.send('page.ready');
</script>
