[package]
name = "NativeInvoker"
description = "Calling GTA IV script natives from Rust, and logging which natives the scripts call."
version = "0.1.0"
edition = "2024"

[lib]
name = "ivmp_natives"

[dependencies]
Core = { path = "../Core" }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
