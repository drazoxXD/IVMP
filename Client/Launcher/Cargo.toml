[package]
name = "Launcher"
description = "Native Win32 launcher: starts GTA IV through Steam and injects the IVMP hooks."
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ivmp_launcher"
path = "src/main.rs"

[dependencies]
Shared = { path = "../Shared" }
native-windows-gui = { version = "1.0.13", default-features = false, features = ["notice", "listbox", "combobox", "high-dpi", "embed-resource"] }
native-windows-derive = "1.0.5"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
