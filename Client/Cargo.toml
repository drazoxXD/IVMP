[workspace]
resolver = "3"
members = [
    "Launcher",
    "Core",
    "Hooks",
    "Shared",
    "NativeInvoker",
    "Networking",
    "Networking/crates/Sync",
    "Preload",
    "Scripting", "Patches",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"

[profile.release]
panic = "abort"
