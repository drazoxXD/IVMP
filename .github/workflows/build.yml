# Builds the client (IVMP_Client.dll + ivmp_launcher.exe) and the server (Server.exe, and a
# Linux `Server` for hosting panels like Pelican), zips each and publishes a release.
# Runs when code changes (Client, Server or this file; not for README, docs, images or icons),
# or by hand from the Actions tab. The release is a normal "latest" release; its notes list
# every commit since the previous release, and a build log with the time each part took.
# IVMP_Client.zip is laid out like Client/out/debug: IVMP_Client.dll, ivmp_launcher.exe and the
# `cef` folder (IVMP_Web.exe, CEF's runtime and the ui pages, built from the CEF version pinned in
# Client/web/cef-version.json), so one unzip gives a working client with the web layer.
name: Build

on:
  push:
    branches: [main]
    paths:
      - "Client/**"
      - "Server/**"
      - ".github/workflows/build.yml"
      - "!**/*.md"
      - "!**/*.png"
      - "!**/*.ico"
      - "!**/*.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Client
            Server

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force log | Out-Null
          function Fmt([double]$s) {
            if ($s -ge 60) { return "{0}min {1}sec" -f [int][math]::Floor($s / 60), [int]($s % 60) }
            return "{0}sec" -f [int]$s
          }
          function Step([string]$name, [string]$dir, [string]$cargoArgs) {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            Push-Location $dir
            Invoke-Expression "cargo build --release --locked $cargoArgs"
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { throw "$name failed" }
            Add-Content log/win.txt "${name}: built in $(Fmt $sw.Elapsed.TotalSeconds)"
          }
          # Server first, then the launcher, then the 32-bit DLL injected into GTAIV.exe.
          Step "Server(win64)" "Server" ""
          Step "Client-launcher(win64)" "Client" "-p Launcher"
          Step "Client-Dll(win32)" "Client" "--target i686-pc-windows-msvc -p Hooks"

      # The client files go up unzipped: the release job adds the cef folder and zips them.
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/client, dist/server | Out-Null
          Copy-Item Client/target/i686-pc-windows-msvc/release/IVMP_Client.dll dist/client/
          Copy-Item Client/target/release/ivmp_launcher.exe dist/client/
          Copy-Item Server/target/release/Server.exe dist/server/
          Compress-Archive -Path dist/server/* -DestinationPath dist/IVMP_Server.zip

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: |
            dist/client
            dist/IVMP_Server.zip
            log/win.txt

  # The Linux server (the Pelican egg downloads it).
  server-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Server

      - name: Build server
        working-directory: Server
        run: |
          mkdir -p ../log
          start=$SECONDS
          cargo build --release --locked
          t=$((SECONDS - start))
          if [ "$t" -ge 60 ]; then time="$((t / 60))min $((t % 60))sec"; else time="${t}sec"; fi
          echo "Server(linux): built in $time" >> ../log/linux.txt

      - name: Zip
        run: |
          mkdir -p dist
          cp Server/target/release/Server dist/
          chmod +x dist/Server
          (cd dist && zip -9 ../IVMP_Server_Linux.zip Server)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            IVMP_Server_Linux.zip
            log/linux.txt

  # The web layer: IVMP_Web.exe (CEF in its own process), CEF's runtime and the ui pages, in the
  # `cef` folder that sits next to IVMP_Client.dll.
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pinned CEF version
        id: cef
        shell: pwsh
        run: |
          $v = Get-Content Client/web/cef-version.json | ConvertFrom-Json
          "file=$($v.file)" >> $env:GITHUB_OUTPUT
          "url=$($v.url)" >> $env:GITHUB_OUTPUT
          "sha1=$($v.sha1)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: cef-download
          key: cef-${{ steps.cef.outputs.sha1 }}

      # CEF's wrapper library takes most of the build; build.bat skips it when it is there.
      - uses: actions/cache@v4
        with:
          path: Client/web/host/obj/libcef_dll_wrapper.lib
          key: cef-wrapper-${{ steps.cef.outputs.sha1 }}-${{ hashFiles('Client/web/host/build.bat') }}

      - name: Download CEF
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cef-download | Out-Null
          $archive = "cef-download/${{ steps.cef.outputs.file }}"
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest -Uri "${{ steps.cef.outputs.url }}" -OutFile $archive
          }
          $hash = (Get-FileHash $archive -Algorithm SHA1).Hash.ToLower()
          if ($hash -ne "${{ steps.cef.outputs.sha1 }}") { throw "CEF archive checksum mismatch: $hash" }
          New-Item -ItemType Directory -Force cef-src | Out-Null
          tar -xjf $archive -C cef-src

      - name: Build IVMP_Web.exe and assemble the cef folder
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $env:CEF_DIR = (Get-ChildItem cef-src -Directory | Select-Object -First 1).FullName
          cmd /c "Client\web\host\build.bat"
          if ($LASTEXITCODE -ne 0) { throw "web build failed" }
          New-Item -ItemType Directory -Force log | Out-Null
          $s = [int]$sw.Elapsed.TotalSeconds
          $t = if ($s -ge 60) { "{0}min {1}sec" -f [int][math]::Floor($s / 60), ($s % 60) } else { "${s}sec" }
          Add-Content log/web.txt "Web-cef(win32): built in $t"

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            Client/web/host/out/cef
            log/web.txt

  release:
    needs: [build, server-linux, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # Same layout as Client/out/debug: the DLL, the launcher and the cef folder.
      - name: Client zip
        run: |
          cp -r out/Client/web/host/out/cef out/dist/client/cef
          (cd out/dist/client && zip -r -9 -q ../../../IVMP_Client.zip .)
          for f in IVMP_Client.dll ivmp_launcher.exe cef/IVMP_Web.exe cef/libcef.dll cef/ui/index.html; do
            unzip -l IVMP_Client.zip "$f" > /dev/null || { echo "IVMP_Client.zip has no $f"; exit 1; }
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="build-${{ github.run_number }}"
          sha="${{ github.sha }}"
          prev=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')

          {
            echo "## Changes"
            echo
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
              range="$prev..$sha"
            else
              range="$sha"
            fi
            git log --no-merges --format="%s|%H" "$range" | while IFS='|' read -r subject hash; do
              echo "$subject [commit](https://github.com/$REPO/commit/$hash)"
              echo
            done
            echo
            echo "Build log:"
            echo '```'
            cat out/log/win.txt out/log/linux.txt out/log/web.txt
            echo '```'
          } > notes.md

          gh release create "$tag" IVMP_Client.zip out/dist/IVMP_Server.zip out/IVMP_Server_Linux.zip \
            --repo "$REPO" \
            --target "$sha" \
            --title "Build ${{ github.run_number }} (${sha:0:7})" \
            --notes-file notes.md \
            --latest
